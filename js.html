<!DOCTYPE html>
<html>
    <head>
     <style>
       body{
        background-color: #2c3e50;
        color:white;
        text-align:center;
        font-family:sans-serif;
       }
       .game-box{
        background-color:#34495e;
        width:350px; 
        margin:50px auto;
        padding:20px;
        border-radius:15px;
        box-shadow:0px 10px 20px rgba(0,0,0,0.5);
       }
       button{
        background-color:#ff4757;
        color:white;
        font-size:18px;
        padding:10px 20px;
        margin:5px;
        border:none;
        border-radius:8px;
        cursor:pointer;
        transition:0.3s;
       }
       button:hover{
        background-color:#ff6b81;
        transform:scale(1.1);
       }
       p{font-size:18px;}
     </style>
    </head>
    <body>
        <div class="game-box">
      <h2>Rock, Paper, Scissors</h2>
      <p>Choice you</p>
      <button onclick="playGame('Rock')">Rock</button>
      <button onclick="playGame('Paper')">Paper</button>
      <button onclick="playGame('Scissors')">Scissors</button>
      <br><br>
      <p id="user-choice">User choice</p>
      <p id="com-choice">Computer choice</p>
      <p id="result">Result</p>
      </div>
    </body>
    <script>
         function playGame(userpicked){

            document.getElementById("user-choice").innerText = "You Choice : " + userpicked;

            let options = ["Rock", "Paper", "Scissors"];
            let randomNum = Math.floor(Math.random() * 3);
            let comPicked = options[randomNum];

            document.getElementById("com-choice").innerText = "Computer Choice :" + comPicked;

            let msg = document.getElementById("result");

            if(userpicked == comPicked){
                msg.innerText = "नतीजा: अरे! मैच टाई (Draw) हो गया! 🤝";
                msg.style.color = "yellow";

            }
            else if(userpicked == "rock" && comPicked == "scissors"){
                msg.innerText ="नतीजा: आप जीत गए! 🏆 (पत्थर ने कैंची को तोड़ दिया)";
                msg.style.color ="#2ecc71";
            }
            else if(userpicked == "paper" && comPicked == "rock"){
                msg.innerText ="नतीजा: आप जीत गए! 🏆 (कागज़ ने पत्थर को लपेट लिया";
                msg.style.color ="#2ecc71";
            }
            else if(userpicked == "scissors" && comPicked == "paper"){
                msg.innerText ="नतीजा: आप जीत गए! 🏆 (कैंची ने कागज़ को काट दिया)";
                msg.style.color = "#2ecc71";
            }
            else{
                msg.innerText = "नतीजा: कंप्यूटर जीत गया! 💻 (आप हार गए 😢)";
                msg.style.color = "#ff4757";
            }
 
         }
    </script>
</html>
